<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ACHE Interaction Network</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        #network {
            width: 100vw;
            height: 100vh;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="legend">
        <div style="font-weight:bold;margin-bottom:8px;">Interaction Types</div>
        <div class="legend-item"><div class="dot" style="background:#f59e0b;border-radius:0;"></div> Ligand (E20)</div>
        <div class="legend-item"><div class="dot" style="background:#10b981;"></div> Hydrogen Bond</div>
        <div class="legend-item"><div class="dot" style="background:#3b82f6;"></div> Hydrophobic Contact</div>
    </div>
    <div id="network"></div>
    <script>
        const nodes = new vis.DataSet([{"id": "ligand", "label": "E20", "color": "#f59e0b", "size": 30, "shape": "diamond"}, {"id": "res_0", "label": "TRP286", "color": "#3b82f6", "size": 15, "shape": "dot"}, {"id": "res_1", "label": "PHE297", "color": "#3b82f6", "size": 15, "shape": "dot"}, {"id": "res_2", "label": "PHE338", "color": "#3b82f6", "size": 15, "shape": "dot"}, {"id": "res_3", "label": "TRP86", "color": "#3b82f6", "size": 15, "shape": "dot"}, {"id": "res_4", "label": "PHE295", "color": "#10b981", "size": 15, "shape": "dot"}]);
        const edges = new vis.DataSet([{"from": "ligand", "to": "res_0", "label": "Hydrophobic (4.29\u00c5)", "color": "#3b82f6", "width": 1, "dashes": false}, {"from": "ligand", "to": "res_1", "label": "Hydrophobic (4.31\u00c5)", "color": "#3b82f6", "width": 1, "dashes": false}, {"from": "ligand", "to": "res_2", "label": "Hydrophobic (4.32\u00c5)", "color": "#3b82f6", "width": 1, "dashes": false}, {"from": "ligand", "to": "res_3", "label": "Hydrophobic (3.69\u00c5)", "color": "#3b82f6", "width": 1, "dashes": false}, {"from": "ligand", "to": "res_4", "label": "H-Bond (2.94\u00c5)", "color": "#10b981", "width": 2, "dashes": true}]);
        const container = document.getElementById('network');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: {
                font: { color: '#ffffff', size: 12 }
            },
            edges: {
                font: { color: '#9ca3af', size: 10, align: 'middle' },
                color: { color: '#4b5563' }
            },
            physics: {
                stabilization: true,
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 95
                }
            }
        };
        const network = new vis.Network(container, data, options);
    </script>
</body>
</html>
