global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aether-backend'
    scrape_interval: 5s
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
