version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: aether_db
    environment:
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: AetherPasswordV6Secure
      POSTGRES_DB: aether_ramiv6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aether_network

  redis:
    image: redis:7-alpine
    container_name: aether_redis
    ports:
      - "6379:6379"
    networks:
      - aether_network

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/backend.dockerfile
    container_name: aether_backend
    environment:
      - DATABASE_URL=postgresql://aether_admin:AetherPasswordV6Secure@database:5432/aether_ramiv6
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - database
      - redis
    networks:
      - aether_network

  celery_worker:
    build:
      context: ../backend
      dockerfile: ../infrastructure/backend.dockerfile
    container_name: aether_worker
    command: celery -A services.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aether_admin:AetherPasswordV6Secure@database:5432/aether_ramiv6
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - aether_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/frontend.dockerfile
    container_name: aether_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - aether_network

volumes:
  postgres_data:

networks:
  aether_network:
    driver: bridge
