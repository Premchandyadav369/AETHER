apiVersion: v1
kind: Namespace
metadata:
  name: aether-rami

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aether-rami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: premchandyadav369/aether-backend:v6.0.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://aether_admin:AetherPasswordV6Secure@postgres-service:5432/aether_ramiv6"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: aether-rami
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aether-rami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: premchandyadav369/aether-frontend:v6.0.0
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000"
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "250m"
            memory: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: aether-rami
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: frontend
  type: LoadBalancer
